kind = "web"
previewPath = "/"
title = "JBR Creative Group"
version = "1.0.0"
id = "artifacts/jbr-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8081

[services.development]
run = "pnpm --filter @workspace/jbr-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jbr-site", "run", "build" ]
publicDir = "artifacts/jbr-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8081"
BASE_PATH = "/"
